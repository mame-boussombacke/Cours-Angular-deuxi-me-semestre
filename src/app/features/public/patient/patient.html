    <div class="container">
        <h1 class="main-title"><i class="fas fa-user-plus"></i> Créer un Nouveau Patient</h1>

        <div class="content-layout">
            <div class="form-container">
                <form>
                    <div class="row">
                        <div class="field">
                            <label># Numéro Patient</label>
                            <div class="input-group success">
                                <input type="text" value="PAT-001">
                                <i class="fas fa-check check"></i>
                            </div>
                        </div>
                        <div class="field">
                            <label><i class="fas fa-user"></i> Nom</label>
                            <div class="input-group success">
                                <input type="text" value="Dupont">
                                <i class="fas fa-check check"></i>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label><i class="fas fa-user"></i> Prénom</label>
                            <div class="input-group success">
                                <input type="text" value="Jean">
                                <i class="fas fa-check check"></i>
                            </div>
                        </div>
                        <div class="field">
                            <label><i class="fas fa-phone"></i> Téléphone</label>
                            <div class="input-group success">
                                <input type="text" value="+221 77 123 45 67">
                                <i class="fas fa-check check"></i>
                            </div>
                        </div>
                    </div>

                    <div class="field full">
                        <label><i class="fas fa-map-marker-alt"></i> Adresse</label>
                        <div class="input-group success">
                            <textarea>Rue, Code p</textarea>
                            <i class="fas fa-check check"></i>
                        </div>
                    </div>

                    <div class="field full">
                        <label><i class="fas fa-notes-medical"></i> Antécédents Médicaux</label>
                        <textarea placeholder="Décrivez vos antécédents médicaux, allergies, maladies chroniques..."></textarea>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn-annuler"><i class="fas fa-times-circle"></i> Annuler</button>
                        <button type="submit" class="btn-creer"><i class="fas fa-check-circle"></i> Créer Patient</button>
                    </div>
                </form>
            </div>

            <div class="info-sidebar">
                <div class="info-header">
                    <i class="fas fa-info-circle"></i>
                    <span>Informations</span>
                </div>
                <p class="info-text">Veuillez remplir tous les champs avec les informations correctes du patient.</p>
                
                <div class="required-fields">
                    <strong>Champs requis:</strong>
                    <ul>
                        <li><i class="far fa-check-circle"></i> Numéro Patient</li>
                        <li><i class="far fa-check-circle"></i> Nom</li>
                        <li><i class="far fa-check-circle"></i> Prénom</li>
                        <li><i class="far fa-check-circle"></i> Téléphone</li>
                        <li><i class="far fa-check-circle"></i> Adresse</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
